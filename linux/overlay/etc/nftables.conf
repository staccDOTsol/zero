#!/usr/sbin/nft -f
# Zero: ZERO EGRESS. Nothing leaves this machine; only loopback (127.0.0.1 / ::1) traffic is allowed.
# Loaded at boot by nftables.service (before network-pre.target). NetworkManager will not start
# unless this rule set loaded (see /etc/systemd/system/NetworkManager.service.d/zero-egress.conf).
# To open the network deliberately (root only), see `zero-egress help` and linux/README.md.

flush ruleset

table inet zero_egress {
	chain output {
		type filter hook output priority filter; policy drop;
		oifname "lo" accept
		counter comment "zero-egress: dropped outbound"
	}

	chain input {
		type filter hook input priority filter; policy drop;
		iifname "lo" accept
		counter comment "zero-egress: dropped inbound"
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}
