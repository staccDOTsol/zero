# Zero: fail closed. If the egress firewall did not load, the network stack is not brought up.
[Unit]
Requires=nftables.service
After=nftables.service

[Service]
# DHCP clients send their first packets through raw packet sockets (AF_PACKET), which bypass nftables.
# Without packet sockets NetworkManager cannot send DHCP (or any other raw frame) at all.
# `zero-egress open` lifts this together with the firewall; `zero-egress close` restores it.
RestrictAddressFamilies=~AF_PACKET
