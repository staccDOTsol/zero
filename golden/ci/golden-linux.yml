name: golden-linux
# Full-disk Zero Linux image per tier: the base image + EVERY catalog model for that tier, written in
# and sha256-checked, verified on its first boot in QEMU/KVM, then streamed to private S3. A
# distributor writes the raw image straight onto the laptop NVMe; it boots with every model there.
# Source of truth: staccDOTsol/lecore-plus golden/ (golden/build-golden.sh copies it here).
on:
  workflow_dispatch:
    inputs:
      base_repo: { description: "'s3' (staged from staccDOTsol/lecore-plus by its golden-stage workflow) or a public repo holding the base Linux release", default: "s3" }
      base_tag: { description: "base Linux release tag", required: true }
      tiers: { description: "JSON list of tiers", default: '["pro","max","ultra"]' }
      upload: { description: "upload the image to S3", type: boolean, default: true }
permissions: { contents: read }
jobs:
  golden:
    strategy:
      fail-fast: false
      matrix: { tier: "${{ fromJSON(inputs.tiers) }}" }
    runs-on: zero-golden-32
    timeout-minutes: 355
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      BUCKET: zero-golden-images-143795940981
      TIER: ${{ matrix.tier }}
      BASE_REPO: ${{ inputs.base_repo }}
      BASE_TAG: ${{ inputs.base_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          nproc; free -g; df -h; ls -l /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd gdisk cloud-guest-utils e2fsprogs aria2 qemu-system-x86 qemu-utils ovmf >/dev/null
          command -v aws && aws --version
      - name: Work dir on the big disk
        run: |
          BIG=$(df --output=avail,target -B1 -x tmpfs -x devtmpfs | tail -n +2 | sort -n | tail -1 | awk '{print $2}')
          echo "WORK=$BIG/zero-work" >> "$GITHUB_ENV"; sudo mkdir -p "$BIG/zero-work"; sudo chown "$USER" "$BIG/zero-work"
          df -h "$BIG"
      - name: Models, in parallel (aria2c, sha256-checked) into the provisioner's cache
        run: |
          set -euo pipefail
          mkdir -p "$WORK/model-cache"
          python3 golden/lib/catalog.py aria2 "$TIER" "$WORK/model-cache" --provision-layout > "$WORK/aria2.list"
          for attempt in 1 2 3; do
            aria2c -i "$WORK/aria2.list" -j 6 -x 16 -s 16 -k 64M --file-allocation=falloc -c \
              --auto-file-renaming=false --allow-overwrite=true --check-integrity=true \
              --max-tries=20 --retry-wait=10 --connect-timeout=30 --timeout=120 \
              --summary-interval=300 --console-log-level=warn --download-result=hide && break
            [ "$attempt" = 3 ] && exit 1; sleep 20
          done
          # provision/linux-add-models.sh trusts a cache file whose <file>.sha256 holds the catalog sha256
          # and is newer than the file (aria2c has just checked every sha256)
          python3 golden/lib/catalog.py plan "$TIER" | while IFS=$'\t' read -r _ repo path _ _ sha _; do
            echo "$sha" > "$WORK/model-cache/$repo/$path.sha256"
          done
          du -sh "$WORK/model-cache"
      - name: Base image
        working-directory: ${{ env.WORK }}
        run: |
          set -euo pipefail
          if [ "$BASE_REPO" = s3 ]; then
            aws s3 cp "s3://$BUCKET/base/linux/$BASE_TAG/" . --recursive --exclude '*' --include 'zero-*.img.zst.part*' --include SHA256SUMS --only-show-errors
          else
            curl -fsSL -o SHA256SUMS "https://github.com/$BASE_REPO/releases/download/$BASE_TAG/SHA256SUMS"
            for u in $(gh release view "$BASE_TAG" -R "$BASE_REPO" --json assets -q '.assets[].url' | grep -E '\.img\.zst\.part[0-9]+$'); do curl -fsSL -O "$u"; done
          fi
          grep -E '\.part[0-9]+$' SHA256SUMS | sha256sum -c -
          cat zero-*.img.zst.part* | zstd -d -o zero.img && rm -f zero-*.img.zst.part*
          ls -l zero.img
      - name: Every model for the tier, into the image (provision/linux-add-models.sh, copies re-hashed)
        run: |
          sudo -E provision/linux-add-models.sh --all "$TIER" \
            --image "$WORK/zero.img" --cache "$WORK/model-cache"
          sudo rm -rf "$WORK/model-cache"
          ls -l "$WORK/zero.img"; df -h "$WORK"
      - name: Verify (every model's sha256 read back from the image; first boot in QEMU/KVM)
        run: |
          set +e
          sudo golden/linux/verify.sh "$WORK/zero.img" "$TIER" "$WORK/verify"
          echo "VERIFY_RC=$?" >> "$GITHUB_ENV"
          { echo "### $TIER: golden image verification"; echo '```'; cat "$WORK/verify/verify-report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Stream to S3 (raw sha256 + zstd)
        if: inputs.upload
        working-directory: ${{ env.WORK }}
        run: |
          set -euo pipefail
          P="linux/$BASE_TAG"; V=PASS
          if [ "$VERIFY_RC" != 0 ]; then P="$P/failed-verification"; V=FAIL; fi
          KEY="$P/zero-$TIER-linux.img.zst"
          SIZE=$(stat -c%s zero.img)
          SRCREPO=$BASE_REPO; [ "$BASE_REPO" = s3 ] && SRCREPO=staccDOTsol/lecore-plus
          aws configure set default.s3.max_concurrent_requests 32
          aws configure set default.s3.multipart_chunksize 128MB
          tee >(sha256sum | awk '{print $1}' > raw.sha256) < zero.img | zstd -T0 -3 -c \
            | tee >(sha256sum | awk '{print $1}' > zst.sha256) >(wc -c > zst.bytes) \
            | aws s3 cp - "s3://$BUCKET/$KEY" --expected-size "$SIZE" --only-show-errors
          for _ in $(seq 1 300); do [ -s raw.sha256 ] && [ -s zst.sha256 ] && [ -s zst.bytes ] && break; sleep 1; done
          python3 - <<PY | tee manifest.json
          import json, subprocess
          s = json.loads(subprocess.check_output(["python3", "$GITHUB_WORKSPACE/golden/lib/catalog.py", "--catalog", "$GITHUB_WORKSPACE/models/catalog.json", "summary", "$TIER"]))
          print(json.dumps({"product": "Zero", "os": "linux", "tier": "$TIER",
              "format": "raw GPT disk image, zstd-compressed; write with: zstd -dc FILE | dd of=/dev/nvme0n1 bs=16M oflag=direct",
              "raw_bytes": $SIZE, "raw_sha256": open("raw.sha256").read().strip(),
              "zst_bytes": int(open("zst.bytes").read()), "zst_sha256": open("zst.sha256").read().strip(),
              "s3": "s3://$BUCKET/$KEY", "base_release": "$SRCREPO/$BASE_TAG", "golden_commit": "$GITHUB_SHA",
              "catalog": s, "verification": "$V",
              "verification_report": open("verify/verify-report.txt").read().splitlines()}, indent=1))
          PY
          aws s3 cp manifest.json "s3://$BUCKET/$P/zero-$TIER-linux.manifest.json" --only-show-errors
          aws s3 cp verify/verify-report.txt "s3://$BUCKET/$P/zero-$TIER-linux.verify.txt" --only-show-errors
          aws s3 ls "s3://$BUCKET/$P/" --human-readable
      - name: Result
        run: '[ "$VERIFY_RC" = 0 ] || { echo "::error::first-boot verification failed"; exit 1; }'
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-linux-${{ matrix.tier }}-logs
          path: |
            ${{ env.WORK }}/verify/*.txt
            ${{ env.WORK }}/verify/*.log
            ${{ env.WORK }}/manifest.json
          if-no-files-found: ignore
          retention-days: 14
