name: golden-linux
# Full-disk Zero Linux image per tier: the base image + EVERY catalog model for that tier, written in
# and sha256-checked, verified on its first boot in QEMU/KVM, then streamed to the private object store
# (any S3-compatible service; see the env block and golden/lib/store.sh). A
# distributor writes the raw image straight onto the laptop NVMe; it boots with every model there.
# Source of truth: staccDOTsol/lecore-plus golden/ (golden/build-golden.sh copies it here).
on:
  workflow_dispatch:
    inputs:
      base_repo: { description: "'store' (staged from staccDOTsol/lecore-plus into the object store by its golden-stage workflow) or a public repo holding the base Linux release", default: "store" }
      base_tag: { description: "base Linux release tag", required: true }
      tiers: { description: "JSON list of tiers", default: '["pro","max","ultra"]' }
      upload: { description: "upload the image to S3", type: boolean, default: true }
permissions: { contents: read }
jobs:
  golden:
    strategy:
      fail-fast: false
      matrix: { tier: "${{ fromJSON(inputs.tiers) }}" }
    runs-on: zero-golden-32
    timeout-minutes: 355
    env:
      # object store: any S3-compatible service (golden/lib/store.sh). Repo variables S3_ENDPOINT_URL
      # (empty = AWS S3), STORE_BUCKET, STORE_REGION; secrets STORE_ACCESS_KEY_ID/STORE_SECRET_ACCESS_KEY
      # (falling back to AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY).
      S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
      STORE_BUCKET: ${{ vars.STORE_BUCKET || 'zero-golden-images-143795940981' }}
      AWS_REGION: ${{ vars.STORE_REGION || 'us-east-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.STORE_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STORE_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
      TIER: ${{ matrix.tier }}
      BASE_REPO: ${{ inputs.base_repo }}
      BASE_TAG: ${{ inputs.base_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          nproc; free -g; df -h; ls -l /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd gdisk cloud-guest-utils e2fsprogs aria2 qemu-system-x86 qemu-utils ovmf >/dev/null
          sudo chmod 666 /dev/kvm || true
          command -v aws && aws --version
      - name: Work dir on the big disk
        run: |
          BIG=$(df --output=avail,target -B1 -x tmpfs -x devtmpfs | tail -n +2 | sort -n | tail -1 | awk '{print $2}')
          echo "WORK=$BIG/zero-work" >> "$GITHUB_ENV"; sudo mkdir -p "$BIG/zero-work"; sudo chown "$USER" "$BIG/zero-work"
          df -h "$BIG"
      - name: Base image
        working-directory: ${{ env.WORK }}
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/golden/lib/store.sh"
          if [ "$BASE_REPO" = store ] || [ "$BASE_REPO" = s3 ]; then
            store s3 cp "$(store_uri "base/linux/$BASE_TAG/")" . --recursive --exclude '*' --include 'zero-*.img.zst.part*' --include SHA256SUMS --only-show-errors
          else
            curl -fsSL -o SHA256SUMS "https://github.com/$BASE_REPO/releases/download/$BASE_TAG/SHA256SUMS"
            for u in $(gh release view "$BASE_TAG" -R "$BASE_REPO" --json assets -q '.assets[].url' | grep -E '\.img\.zst\.part[0-9]+$'); do curl -fsSL -O "$u"; done
          fi
          grep -E '\.part[0-9]+$' SHA256SUMS | sha256sum -c -
          cat zero-*.img.zst.part* | zstd -d -o zero.img && rm -f zero-*.img.zst.part*
          ls -l zero.img
      - name: Grow the image to hold the tier, mount its root
        run: |
          set -euo pipefail
          GIB=1073741824
          MB=$(python3 golden/lib/catalog.py summary "$TIER" | python3 -c 'import json,sys; print(json.load(sys.stdin)["bytes"])')
          # base + the models + 6 GiB; the downloads run as root, so ext4's 5% root reserve is usable too
          # (the image stays as small as it can be: the root grows to fill the NVMe on the first boot)
          NEW=$(( ($(stat -c %s "$WORK/zero.img") + MB + 6 * GIB + GIB - 1) / GIB * GIB ))
          truncate -s "$NEW" "$WORK/zero.img"
          sgdisk -e "$WORK/zero.img" >/dev/null
          LOOP=$(sudo losetup -f --show -P "$WORK/zero.img"); sudo udevadm settle || sleep 2
          ROOT=$(lsblk -lnpo NAME,PARTLABEL "$LOOP" | awk '$2=="zero-root"{print $1}')
          sudo growpart "$LOOP" "${ROOT##*p}" || [ $? = 1 ]
          sudo e2fsck -f -y "$ROOT" || [ $? -le 1 ]
          sudo resize2fs "$ROOT"
          sudo mkdir -p "$WORK/root" && sudo mount "$ROOT" "$WORK/root"
          echo "LOOP=$LOOP" >> "$GITHUB_ENV"
          df -h "$WORK/root" "$WORK"
      - name: Every model for the tier, downloaded straight into the image (aria2c, parallel, sha256 per file)
        run: |
          set -euo pipefail
          C="$WORK/root/var/lib/lecore-plus/.golden-download"
          sudo mkdir -p "$C"
          python3 golden/lib/catalog.py aria2 "$TIER" "$C" --provision-layout > "$WORK/aria2.list"
          for attempt in 1 2 3; do
            sudo aria2c -i "$WORK/aria2.list" -j 6 -x 16 -s 16 -k 64M --file-allocation=falloc -c \
              --auto-file-renaming=false --allow-overwrite=true --check-integrity=true \
              --max-tries=20 --retry-wait=10 --connect-timeout=30 --timeout=120 \
              --summary-interval=300 --console-log-level=warn --download-result=hide && break
            [ "$attempt" = 3 ] && exit 1; sleep 20
          done
          # provision/linux-add-models.sh trusts a cache file whose <file>.sha256 holds the catalog sha256
          # and is newer than the file (aria2c has just checked every sha256)
          python3 golden/lib/catalog.py plan "$TIER" | while IFS=$'\t' read -r _ repo path _ _ sha _; do
            echo "$sha" | sudo tee "$C/$repo/$path.sha256" >/dev/null
          done
          sudo du -sh "$C"; df -h "$WORK" "$WORK/root"
      - name: Into place with provision/linux-add-models.sh (moved within the image, zero-models.json, default model)
        run: |
          set -euo pipefail
          C="$WORK/root/var/lib/lecore-plus/.golden-download"
          sudo -E provision/linux-add-models.sh --all "$TIER" --target "$WORK/root" --cache "$C" --move --no-verify-target --reserve-gb 0
          sudo rm -rf "$C"
          sudo umount "$WORK/root"; sudo e2fsck -fn "$(lsblk -lnpo NAME,PARTLABEL "$LOOP" | awk '$2=="zero-root"{print $1}')"
          sudo losetup -d "$LOOP"
          ls -ls "$WORK/zero.img"; df -h "$WORK"
      - name: Verify (every model's sha256 read back from the image; first boot in QEMU/KVM)
        run: |
          set +e
          sudo golden/linux/verify.sh "$WORK/zero.img" "$TIER" "$WORK/verify"; RC=$?
          { echo "### $TIER: golden image verification"; echo '```'; cat "$WORK/verify/verify-report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $RC
      - name: Stream to S3 (raw sha256 + zstd), only a verified image
        if: inputs.upload
        working-directory: ${{ env.WORK }}
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/golden/lib/store.sh"
          P="linux/$BASE_TAG"; V=PASS
          KEY="$P/zero-$TIER-linux.img.zst"
          SIZE=$(stat -c%s zero.img)
          SRCREPO=$BASE_REPO; case "$BASE_REPO" in store|s3) SRCREPO=staccDOTsol/lecore-plus ;; esac
          store_tune
          tee >(sha256sum | awk '{print $1}' > raw.sha256) < zero.img | zstd -T0 -3 -c \
            | tee >(sha256sum | awk '{print $1}' > zst.sha256) >(wc -c > zst.bytes) \
            | store s3 cp - "$(store_uri "$KEY")" --expected-size "$SIZE" --only-show-errors
          for _ in $(seq 1 300); do [ -s raw.sha256 ] && [ -s zst.sha256 ] && [ -s zst.bytes ] && break; sleep 1; done
          python3 - <<PY | tee manifest.json
          import json, subprocess
          s = json.loads(subprocess.check_output(["python3", "$GITHUB_WORKSPACE/golden/lib/catalog.py", "--catalog", "$GITHUB_WORKSPACE/models/catalog.json", "summary", "$TIER"]))
          print(json.dumps({"product": "Zero", "os": "linux", "tier": "$TIER",
              "format": "raw GPT disk image, zstd-compressed; write with: zstd -dc FILE | dd of=/dev/nvme0n1 bs=16M oflag=direct",
              "raw_bytes": $SIZE, "raw_sha256": open("raw.sha256").read().strip(),
              "zst_bytes": int(open("zst.bytes").read()), "zst_sha256": open("zst.sha256").read().strip(),
              "s3": "$(store_uri "$KEY")", "endpoint": "${S3_ENDPOINT_URL:-aws}", "base_release": "$SRCREPO/$BASE_TAG", "golden_commit": "$GITHUB_SHA",
              "catalog": s, "verification": "$V",
              "verification_report": open("verify/verify-report.txt").read().splitlines()}, indent=1))
          PY
          store s3 cp manifest.json "$(store_uri "$P/zero-$TIER-linux.manifest.json")" --only-show-errors
          store s3 cp verify/verify-report.txt "$(store_uri "$P/zero-$TIER-linux.verify.txt")" --only-show-errors
          store s3 ls "$(store_uri "$P/")" --human-readable
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-linux-${{ matrix.tier }}-logs
          path: |
            ${{ env.WORK }}/verify/*.txt
            ${{ env.WORK }}/verify/*.log
            ${{ env.WORK }}/manifest.json
          if-no-files-found: ignore
          retention-days: 14
