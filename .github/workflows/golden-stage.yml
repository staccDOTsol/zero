name: golden-stage
# Copies base releases of this PRIVATE repo (the Linux base image; the Windows install ISOs, which exist
# only here) into the PRIVATE golden-image object store, where the golden builds in
# kekloldyormarket/zero-golden read them (base/{linux,windows}/<tag>/ in the bucket).
# The store is any S3-compatible service (golden/lib/store.sh): repo variables S3_ENDPOINT_URL (empty =
# AWS S3), STORE_BUCKET, STORE_REGION and secrets STORE_ACCESS_KEY_ID / STORE_SECRET_ACCESS_KEY. Without
# those secrets it uses AWS through GitHub OIDC -> IAM role zero-golden-stage-lecore-plus (main branch of
# this repo only, the bucket's base/ prefix only).
# It stages from the releases of the repo it runs in: here (lecore-plus) the linux-* bases; in
# kekloldyormarket/zero-golden (a copy, golden/build-golden.sh) the windows-* ISOs, which are built there.
# Not in the public mirror (staccDOTsol/zero): it handles Windows ISOs.
on:
  workflow_dispatch:
    inputs:
      windows_tag: { description: "windows-* release tag, 'latest', or 'none'", default: latest }
      linux_tag: { description: "linux-* release tag, 'latest', or 'none'", default: latest }
permissions: { contents: read, id-token: write }
concurrency: { group: golden-stage, cancel-in-progress: false }
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
      STORE_BUCKET: ${{ vars.STORE_BUCKET || 'zero-golden-images-143795940981' }}
      AWS_REGION: ${{ vars.STORE_REGION || 'us-east-1' }}
      STORE_KEYS: ${{ secrets.STORE_ACCESS_KEY_ID != '' }}
      GH_TOKEN: ${{ github.token }}
      WIN: ${{ inputs.windows_tag }}
      LIN: ${{ inputs.linux_tag }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: golden/lib }
      - name: AWS keys through OIDC (no STORE_* secrets)
        if: env.STORE_KEYS != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::143795940981:role/zero-golden-stage-lecore-plus
          aws-region: us-east-1
          role-duration-seconds: 7200
      - name: Stage (streamed, every asset sha256-checked against the release's SHA256SUMS)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STORE_ACCESS_KEY_ID || env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STORE_SECRET_ACCESS_KEY || env.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.STORE_ACCESS_KEY_ID == '' && env.AWS_SESSION_TOKEN || '' }}
        run: |
          set -euo pipefail
          . golden/lib/store.sh
          newest() { gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt,isDraft \
            -q "[.[] | select(.isDraft | not) | select(.tagName | startswith(\"$1\"))] | sort_by(.createdAt) | last | .tagName"; }
          stage() { # kind tag asset-regex
            local kind=$1 tag=$2 re=$3
            [ "$tag" = none ] && return 0
            [ "$tag" = latest ] && tag=$(newest "$kind-")
            echo "== $kind $tag"; echo "### golden-stage: $kind \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
            rm -rf sums && mkdir -p sums && gh release download "$tag" -R "$GITHUB_REPOSITORY" -p 'SHA256SUMS*' -D sums
            sed -i 's/\r$//' sums/*   # the Windows release writes CRLF
            gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[] | "\(.name)\t\(.size)"' > assets.tsv
            local P name size want have
            P=$(store_uri "base/$kind/$tag")
            while IFS=$'\t' read -r name size; do
              echo "$name" | grep -qE "$re" || continue
              want=$(awk -v n="$name" '$2==n{print $1}' sums/SHA256SUMS)
              have=$(store s3api head-object --bucket "$STORE_BUCKET" --key "base/$kind/$tag/$name" --query ContentLength --output text 2>/dev/null || true)
              if [ "$have" = "$size" ]; then echo "  present: $name"; continue; fi
              echo "  copying $name ($size bytes)"
              rm -f part.sha256
              gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "$name" -O - \
                | tee >(sha256sum | awk '{print $1}' > part.sha256) \
                | store s3 cp - "$P/$name" --expected-size "$size" --only-show-errors
              for _ in $(seq 1 60); do [ -s part.sha256 ] && break; sleep 1; done
              case "$name" in SHA256SUMS*|BUILDINFO.txt) ;; *) [ -n "$want" ] || { echo "::error::$name is not in SHA256SUMS"; exit 1; } ;; esac
              if [ -n "$want" ] && [ "$(cat part.sha256)" != "$want" ]; then
                store s3 rm "$P/$name" --only-show-errors; echo "::error::$name sha256 mismatch"; exit 1
              fi
            done < assets.tsv
            store s3 ls "$P/" --human-readable | tee -a "$GITHUB_STEP_SUMMARY"
          }
          stage windows "$WIN" '(\.iso\.part[0-9]+|^SHA256SUMS.*)$'
          stage linux "$LIN" '(\.img\.zst\.part[0-9]+|^SHA256SUMS|^BUILDINFO\.txt)$'
