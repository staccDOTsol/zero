name: golden-stage
# Copies a Windows base release (the Zero install ISOs, which exist only in this private repo) into
# the PRIVATE golden-image bucket, where the golden builds in kekloldyormarket/zero-golden read them.
# AWS access is GitHub OIDC -> IAM role zero-golden-stage-lecore-plus: main branch of this repo only,
# write access to the bucket's base/ prefix only. No AWS keys are stored anywhere.
# Not in the public mirror (staccDOTsol/zero): like windows-image.yml it handles Windows ISOs.
on:
  workflow_dispatch:
    inputs:
      windows_tag: { description: "windows-* release tag, or 'latest'", default: latest }
permissions: { contents: read, id-token: write }
concurrency: { group: golden-stage, cancel-in-progress: false }
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUCKET: zero-golden-images-143795940981
      GH_TOKEN: ${{ github.token }}
      WANT: ${{ inputs.windows_tag }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::143795940981:role/zero-golden-stage-lecore-plus
          aws-region: us-east-1
      - name: Stage the ISO parts (streamed, sha256-checked against the release's SHA256SUMS)
        run: |
          set -euo pipefail
          TAG=$WANT
          if [ "$TAG" = latest ]; then
            TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt,isDraft \
              -q '[.[] | select(.isDraft | not) | select(.tagName | startswith("windows-"))] | sort_by(.createdAt) | last | .tagName')
          fi
          echo "release $TAG"
          echo "### golden-stage: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p sums && gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'SHA256SUMS*' -D sums
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[] | "\(.name)\t\(.size)"' > assets.tsv
          P="s3://$BUCKET/base/windows/$TAG"
          while IFS=$'\t' read -r name size; do
            case "$name" in *.iso.part[0-9]*|SHA256SUMS*) ;; *) continue ;; esac
            want=$(awk -v n="$name" '$2==n{print $1}' sums/SHA256SUMS)
            have=$(aws s3api head-object --bucket "$BUCKET" --key "base/windows/$TAG/$name" --query ContentLength --output text 2>/dev/null || true)
            if [ "$have" = "$size" ]; then echo "  present: $name"; continue; fi
            echo "  copying $name ($size bytes)"
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$name" -O - \
              | tee >(sha256sum | awk '{print $1}' > part.sha256) \
              | aws s3 cp - "$P/$name" --expected-size "$size" --only-show-errors
            for _ in $(seq 1 60); do [ -s part.sha256 ] && break; sleep 1; done
            if [ -n "$want" ] && [ "$(cat part.sha256)" != "$want" ]; then
              aws s3 rm "$P/$name" --only-show-errors; echo "::error::$name sha256 mismatch"; exit 1
            fi
            rm -f part.sha256
          done < assets.tsv
          aws s3 ls "$P/" --human-readable | tee -a "$GITHUB_STEP_SUMMARY"
